<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 240px;
        margin: 0;
        padding: 12px;
        font-family: "Google Sans", Roboto, Arial, sans-serif;
        color: #3c4043;
      }
      h1 {
        font-size: 13px;
        margin: 0 0 10px;
        font-weight: 500;
      }
      button {
        display: block;
        width: 100%;
        margin-bottom: 8px;
        padding: 8px 10px;
        font-size: 13px;
        border: 1px solid #dadce0;
        border-radius: 8px;
        background: #fff;
        color: #1a73e8;
        cursor: pointer;
        text-align: left;
      }
      button:hover {
        background: #f1f3f4;
      }
      .hint {
        font-size: 11px;
        color: #80868b;
        margin: 6px 0 0;
        line-height: 1.5;
      }
      kbd {
        background: #f1f3f4;
        border: 1px solid #dadce0;
        border-radius: 4px;
        padding: 0 4px;
        font-size: 10px;
      }
      #status {
        font-size: 12px;
        color: #137333;
        min-height: 16px;
        margin-top: 4px;
      }
      #status.err {
        color: #c5221f;
      }
    </style>
  </head>
  <body>
    <h1>Gmail Message Link Copier</h1>
    <button id="msg">🔗 Copy this message link</button>
    <button id="thread">🧵 Copy thread link</button>
    <div id="status"></div>
    <p class="hint">
      Shortcuts: <kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>C</kbd> message,
      <kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>T</kbd> thread.<br />
      Change them at <code>chrome://extensions/shortcuts</code>.
    </p>
    <script src="popup.js"></script>
  </body>
</html>
