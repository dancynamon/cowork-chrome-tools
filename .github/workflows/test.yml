name: test

on:
  # main only on push: PR branches are covered by pull_request, so a branch
  # with an open PR doesn't run everything twice.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # node:test against test/chrome-mock.js; no dependencies, no browser.
      - run: npm test
